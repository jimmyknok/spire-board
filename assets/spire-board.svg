<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Original strategy-table spire illustration</title>
  <desc id="desc">A fan-made card table, branching map, and distant tower for a strategy guide.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17130f"/>
      <stop offset="0.44" stop-color="#34251e"/>
      <stop offset="1" stop-color="#8d341f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1">
      <stop offset="0" stop-color="#fff4d2"/>
      <stop offset="1" stop-color="#d7a842"/>
    </linearGradient>
    <filter id="grain">
